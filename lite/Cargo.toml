[package]
name = "tiny-time-track"
description = "Tiny Time Track Lite - standalone weekly planner and timesheet"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = { version = "0.31", default-features = false, features = ["datepicker"] }
pdf-writer = "0.15.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"       # small and still fast
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2         # keep debug builds of egui snappy

[features]
dev = []   # demo data + window screenshots for development; never in release builds
