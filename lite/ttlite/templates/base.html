<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b05a3e'/%3E%3Cpath d='M16 8v8l5 4' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_ver('app.css') }}">
  <script src="/static/app.js?v={{ asset_ver('app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand-wrap" href="/week" aria-label="{{ APP_NAME }} home">
      <span class="brand">Tiny Time Track</span><span class="lite-tag">Lite</span>
    </a>
    <nav class="mainnav" aria-label="Main">
      <a href="/week" {% if nav == 'week' %}aria-current="page"{% endif %}>Week</a>
      <a href="/projects" {% if nav == 'projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="/timesheets" {% if nav == 'timesheets' %}aria-current="page"{% endif %}>Timesheets</a>
      <a href="/report" {% if nav == 'report' %}aria-current="page"{% endif %}>Reports</a>
      <a href="/settings" {% if nav == 'settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    {% if settings.user_name %}<span class="who">{{ settings.user_name }}</span>{% endif %}
  </header>

  <main id="main" class="container">
    {% if msg %}<div class="banner ok" role="status">{{ msg }}</div>{% endif %}
    {% if err %}<div class="banner warn" role="alert">{{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
